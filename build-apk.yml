name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Añadir plataforma Android
        run: npx cap add android

      - name: Generar ícono y splash screen
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Usar keystore de depuración fijo
        run: |
          mkdir -p ~/.android
          if [ -f "keystore/debug.keystore" ]; then
            cp keystore/debug.keystore ~/.android/debug.keystore
            echo "Keystore fijo instalado: las actualizaciones conservarán los datos guardados."
          else
            echo "No se encontró keystore/debug.keystore: se usará uno generado al vuelo (las actualizaciones podrían requerir desinstalar la version anterior)."
          fi

      - name: Compilar APK de depuración
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
