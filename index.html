<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Enfoque</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14151c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14151c;
    --surface:#1c1e27;
    --surface-raised:#252836;
    --surface-raised-2:#2d3040;
    --border:#323544;
    --text:#f1f0f5;
    --text-dim:#8d8fa3;
    --text-faint:#5c5e70;
    --primary:#7c6fff;
    --primary-dim:#4f4699;
    --mint:#4ecdc4;
    --amber:#ffb454;
    --rose:#ff7a93;
    --sky:#5ac8fa;
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    display:flex;
    justify-content:center;
  }
  h1,h2,h3,.display{font-family:'Outfit', system-ui, sans-serif;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--primary-dim);}
  :focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .app-frame{
    width:100%; max-width:460px;
    height:100dvh;
    display:flex; flex-direction:column;
    position:relative;
    background:var(--bg);
    overflow:hidden;
  }

  /* Header */
  .header{padding:18px 20px 14px; flex-shrink:0;}
  .header-top{display:flex; align-items:flex-start; justify-content:space-between;}
  .app-name{font-size:22px; font-weight:700; letter-spacing:-0.02em;}
  .app-date{font-size:13px; color:var(--text-dim); margin-top:2px; text-transform:capitalize;}
  .streak-badge{
    display:flex; align-items:center; gap:5px;
    background:var(--surface); border:1px solid var(--border);
    padding:6px 11px; border-radius:99px; font-size:13px; font-weight:600;
    color:var(--amber);
  }
  .streak-badge svg{width:15px; height:15px;}
  .streak-badge.hidden{display:none;}

  /* View container */
  .view-container{flex:1; overflow-y:auto; padding:4px 20px 100px; -webkit-overflow-scrolling:touch;}
  .view-container::-webkit-scrollbar{width:0;}

  .section-label{font-size:13px; color:var(--text-dim); font-weight:600; margin:18px 2px 8px; display:flex; align-items:center; justify-content:space-between;}
  .section-label .count{color:var(--text-faint); font-weight:500;}

  /* Filter chips */
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding:10px 0 4px; margin-bottom:2px;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    padding:7px 13px; border-radius:99px; font-size:13px; font-weight:500;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    transition:background .15s, color .15s, border-color .15s;
  }
  .chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .chip .dot{width:7px; height:7px; border-radius:50%;}

  /* Task rows */
  .task-row{
    display:flex; align-items:flex-start; gap:12px;
    background:var(--surface); border:1px solid var(--border);
    border-left:3px solid var(--primary);
    border-radius:var(--radius-m);
    padding:13px 14px; margin-bottom:9px;
  }
  .task-check{
    width:22px; height:22px; border-radius:7px; flex-shrink:0; margin-top:1px;
    border:1.8px solid var(--text-faint); background:transparent;
    display:flex; align-items:center; justify-content:center; color:#fff;
    transition:background .15s, border-color .15s, transform .15s;
  }
  .task-check.checked{background:var(--mint); border-color:var(--mint); transform:scale(1.04);}
  .task-check svg{width:13px; height:13px;}
  .task-info{flex:1; min-width:0;}
  .task-title{font-size:14.5px; font-weight:500; line-height:1.35; word-break:break-word;}
  .task-title.done{color:var(--text-faint); text-decoration:line-through;}
  .task-meta{font-size:12px; color:var(--text-dim); margin-top:4px; display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
  .task-meta .cat-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
  .task-meta.overdue{color:var(--rose);}
  .task-menu{background:none; border:none; color:var(--text-faint); padding:4px; flex-shrink:0;}
  .task-menu svg{width:16px; height:16px;}
  .empty-state{padding:30px 10px; text-align:center; color:var(--text-faint); font-size:13.5px;}
  .collapsible-header{display:flex; align-items:center; justify-content:space-between; padding:2px; cursor:pointer;}
  .collapsible-header svg{width:16px; height:16px; color:var(--text-faint); transition:transform .2s;}
  .collapsible-header.open svg{transform:rotate(180deg);}

  /* FAB */
  .fab{
    position:absolute; right:20px; bottom:96px;
    width:54px; height:54px; border-radius:18px;
    background:var(--primary); border:none; color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(124,111,255,0.35);
    transition:transform .15s;
    z-index:5;
  }
  .fab:active{transform:scale(0.92);}
  .fab svg{width:24px; height:24px;}
  .fab.hidden{display:none;}

  /* Tabbar */
  .tabbar{
    flex-shrink:0; display:flex; background:var(--surface);
    border-top:1px solid var(--border);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    position:relative; z-index:4;
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--text-faint); padding:6px 2px; border-radius:10px;
  }
  .tab-btn svg{width:21px; height:21px;}
  .tab-btn span{font-size:10.5px; font-weight:500;}
  .tab-btn.active{color:var(--primary);}

  /* Calendar */
  .cal-header{display:flex; align-items:center; justify-content:space-between; padding:10px 2px 4px;}
  .cal-title{font-size:16px; font-weight:600; text-transform:capitalize;}
  .cal-nav-btn{background:var(--surface); border:1px solid var(--border); border-radius:10px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--text);}
  .cal-nav-btn svg{width:16px; height:16px;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); margin-top:12px;}
  .cal-weekdays span{text-align:center; font-size:11px; color:var(--text-faint); font-weight:600; text-transform:uppercase;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:6px;}
  .cal-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:12px; font-size:13px; color:var(--text-dim); position:relative; gap:3px;
    border:1px solid transparent;
  }
  .cal-cell.dim{color:var(--text-faint); opacity:0.45;}
  .cal-cell.today{border-color:var(--primary); color:var(--text); font-weight:600;}
  .cal-cell.selected{background:var(--primary); color:#fff; font-weight:600;}
  .cal-dots{display:flex; gap:2px; height:5px;}
  .cal-dots span{width:4px; height:4px; border-radius:50%;}
  .cal-day-list{margin-top:20px;}

  /* Pomodoro */
  .pomo-mode{text-align:center; font-size:14px; font-weight:600; color:var(--text-dim); margin-top:14px; text-transform:uppercase; letter-spacing:0.06em;}
  .pomo-ring-wrap{position:relative; width:230px; height:230px; margin:22px auto 8px;}
  .pomo-ring-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring-bg{fill:none; stroke:var(--surface-raised); stroke-width:10;}
  .ring-progress{fill:none; stroke:var(--primary); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s;}
  .pomo-time{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:44px; font-weight:700; font-family:'Outfit',sans-serif; letter-spacing:-0.02em;
  }
  .pomo-session-dots{display:flex; justify-content:center; gap:7px; margin:6px 0 22px;}
  .pomo-session-dots span{width:7px; height:7px; border-radius:50%; background:var(--surface-raised-2);}
  .pomo-session-dots span.filled{background:var(--primary);}
  .pomo-controls{display:flex; gap:10px; justify-content:center; align-items:center;}
  .pomo-btn-main{
    background:var(--primary); color:#fff; border:none; border-radius:16px;
    padding:14px 34px; font-size:15px; font-weight:600;
  }
  .pomo-btn-side{
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    border-radius:16px; padding:14px 18px; font-size:14px; font-weight:500;
  }
  .pomo-extra{margin-top:26px;}
  .field-label{font-size:12.5px; color:var(--text-dim); font-weight:600; margin-bottom:7px; display:block;}
  .select-field{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:12px 13px; border-radius:12px; font-size:14px; appearance:none;
  }
  .link-btn{background:none; border:none; color:var(--text-dim); font-size:13px; text-decoration:underline; margin-top:16px; display:block; width:100%; text-align:center;}

  /* Stats */
  .stat-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:13px 10px; text-align:center;}
  .stat-card .num{font-size:20px; font-weight:700; font-family:'Outfit',sans-serif;}
  .stat-card .lbl{font-size:10.5px; color:var(--text-dim); margin-top:3px; line-height:1.3;}
  .chart-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px; margin-top:14px;}
  .chart-title{font-size:13.5px; font-weight:600; margin-bottom:14px;}
  .bar-chart{display:flex; align-items:flex-end; justify-content:space-between; height:90px; gap:6px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
  .bar-col .bar{width:100%; max-width:22px; border-radius:5px 5px 2px 2px; background:var(--primary); min-height:3px;}
  .bar-col .bar-lbl{font-size:10px; color:var(--text-faint);}
  .cat-stat-row{margin-bottom:12px;}
  .cat-stat-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .cat-stat-top .name{display:flex; align-items:center; gap:6px; font-weight:500;}
  .cat-stat-top .dot{width:8px; height:8px; border-radius:50%;}
  .cat-stat-top .frac{color:var(--text-dim); font-size:12px;}
  .cat-bar-track{height:7px; border-radius:99px; background:var(--surface-raised-2); overflow:hidden;}
  .cat-bar-fill{height:100%; border-radius:99px;}

  /* Sheet / modal */
  .sheet-overlay{
    position:absolute; inset:0; background:rgba(10,10,14,0.6);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:20;
  }
  .sheet-overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    width:100%; max-width:460px; background:var(--surface);
    border-radius:24px 24px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:85%; overflow-y:auto;
    transform:translateY(100%); transition:transform .25s cubic-bezier(.32,.72,0,1);
  }
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:99px; margin:0 auto 16px;}
  .sheet-title{font-size:17px; font-weight:700; margin-bottom:18px;}
  .text-field{
    width:100%; background:var(--surface-raised); border:1px solid var(--border); color:var(--text);
    padding:13px 14px; border-radius:12px; font-size:15px; margin-bottom:16px;
  }
  .segmented{display:flex; gap:8px; margin-bottom:16px;}
  .seg-btn{flex:1; padding:11px 6px; border-radius:11px; background:var(--surface-raised); border:1px solid var(--border); color:var(--text-dim); font-size:13px; font-weight:500;}
  .seg-btn.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .cat-pick-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .cat-pick{display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:99px; background:var(--surface-raised); border:1.5px solid var(--border); font-size:12.5px; color:var(--text-dim);}
  .cat-pick.active{border-color:var(--pcolor); color:var(--text); background:var(--surface-raised-2);}
  .cat-pick .dot{width:8px; height:8px; border-radius:50%;}
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .btn-primary{flex:1; background:var(--primary); color:#fff; border:none; padding:14px; border-radius:13px; font-size:14.5px; font-weight:600;}
  .btn-ghost{background:var(--surface-raised); color:var(--text-dim); border:1px solid var(--border); padding:14px 18px; border-radius:13px; font-size:14.5px; font-weight:500;}
  .cat-manage-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .cat-manage-row .dot{width:14px; height:14px; border-radius:50%; flex-shrink:0;}
  .cat-manage-row .name{flex:1; font-size:14px;}
  .cat-manage-row button{background:none; border:none; color:var(--text-faint); padding:5px;}
  .cat-manage-row button svg{width:16px; height:16px;}
  .color-swatches{display:flex; gap:9px; margin-bottom:16px;}
  .swatch{width:30px; height:30px; border-radius:50%; border:2px solid transparent;}
  .swatch.active{border-color:var(--text);}
</style>
</head>
<body>
<div class="app-frame">
  <header class="header" id="header"></header>
  <main class="view-container" id="viewContainer"></main>
  <button class="fab" id="fab"></button>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Icons ---------- */
  const ICONS = {
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>',
    chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    chevR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
    chevDown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-2 4-2 7a3 3 0 0 0 6 0c1.5 1.5 2 3.5 2 5a6 6 0 1 1-12 0c0-4 2-5 3-7 1-1.5 2-3 3-5z"/></svg>',
    tabTasks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12l2.5 2.5L16 9"/></svg>',
    tabCal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    tabPomo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8.3"/><path d="M12 9v4l2.5 2M9.5 2h5"/></svg>',
    tabStats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>'
  };

  const CAT_PALETTE = ['#7c6fff','#4ecdc4','#ffb454','#ff7a93','#5ac8fa','#9ee37d'];
  const DEFAULT_CATEGORIES = [
    {id:'work', name:'Trabajo', color:'#7c6fff'},
    {id:'personal', name:'Personal', color:'#4ecdc4'},
    {id:'study', name:'Estudio', color:'#ffb454'},
    {id:'health', name:'Salud', color:'#ff7a93'}
  ];
  const WEEKDAYS = ['lun','mar','mié','jue','vie','sáb','dom'];
  const WEEKDAYS_LONG = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const MONTHS_SHORT = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  /* ---------- State ---------- */
  let state = {
    tasks: [],
    categories: DEFAULT_CATEGORIES.slice(),
    sessions: [],
    settings: {work:25, short:5, long:15, longEvery:4},
    loaded:false,
    view:'tasks',
    taskFilter:'all',
    cal:{year:new Date().getFullYear(), month:new Date().getMonth(), selected:todayStr()},
    timer:{mode:'focus', remaining:25*60, running:false, intervalId:null, sessionCount:0, taskId:''},
    editingTaskId:null,
    collapsedDone:true
  };

  /* ---------- Utils ---------- */
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function toDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function todayStr(){ return toDateStr(new Date()); }
  function parseDateStr(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
  function catById(id){ return state.categories.find(c=>c.id===id) || {id:'', name:'Sin categoría', color:'#5c5e70'}; }
  function addDays(dstr, n){ const d=parseDateStr(dstr); d.setDate(d.getDate()+n); return toDateStr(d); }

  function formatDueLabel(dueStr, done){
    const t = todayStr();
    if(dueStr === t) return 'Hoy';
    if(dueStr === addDays(t,1)) return 'Mañana';
    if(dueStr === addDays(t,-1)) return 'Ayer';
    const d = parseDateStr(dueStr);
    const label = d.getDate()+' '+MONTHS_SHORT[d.getMonth()];
    if(dueStr < t && !done) return 'Venció '+label;
    return label;
  }

  /* ---------- Storage ---------- */
  async function loadData(){
    try{
      const raw = localStorage.getItem('enfoque-app-data');
      if(raw){
        const d = JSON.parse(raw);
        state.tasks = d.tasks || [];
        state.categories = (d.categories && d.categories.length) ? d.categories : DEFAULT_CATEGORIES.slice();
        state.sessions = d.sessions || [];
        state.settings = Object.assign({work:25,short:5,long:15,longEvery:4}, d.settings || {});
      }
    }catch(e){ /* sin datos guardados aún: se usan valores por defecto */ }
    state.loaded = true;
    state.timer.remaining = state.settings.work*60;
  }
  let saveTimer=null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 300);
  }
  async function saveNow(){
    try{
      localStorage.setItem('enfoque-app-data', JSON.stringify({
        tasks:state.tasks, categories:state.categories, sessions:state.sessions, settings:state.settings
      }));
    }catch(e){ console.error('No se pudo guardar', e); }
  }

  /* ---------- Header ---------- */
  function renderHeader(){
    const d = new Date();
    const dateLabel = WEEKDAYS_LONG[d.getDay()] + ', ' + d.getDate() + ' de ' + MONTHS[d.getMonth()];
    const streak = computeStreak();
    document.getElementById('header').innerHTML = `
      <div class="header-top">
        <div>
          <div class="app-name">Enfoque</div>
          <div class="app-date">${dateLabel}</div>
        </div>
        <div class="streak-badge ${streak>0?'':'hidden'}">${ICONS.flame}<span>${streak}</span></div>
      </div>`;
  }

  /* ---------- Tabbar ---------- */
  const TABS = [
    {id:'tasks', label:'Tareas', icon:ICONS.tabTasks},
    {id:'calendar', label:'Calendario', icon:ICONS.tabCal},
    {id:'pomodoro', label:'Enfoque', icon:ICONS.tabPomo},
    {id:'stats', label:'Estadísticas', icon:ICONS.tabStats}
  ];
  function renderTabbar(){
    document.getElementById('tabbar').innerHTML = TABS.map(t=>`
      <button class="tab-btn ${state.view===t.id?'active':''}" data-action="go-view" data-view="${t.id}">
        ${t.icon}<span>${t.label}</span>
      </button>`).join('');
    const fab = document.getElementById('fab');
    if(state.view==='tasks' || state.view==='calendar'){
      fab.classList.remove('hidden');
      fab.innerHTML = ICONS.plus;
    } else {
      fab.classList.add('hidden');
    }
  }

  /* ---------- Streak ---------- */
  function computeStreak(){
    const active = new Set();
    state.tasks.forEach(t=>{ if(t.done && t.completedAt) active.add(toDateStr(new Date(t.completedAt))); });
    state.sessions.forEach(s=> active.add(s.date));
    let streak=0, d=new Date();
    while(active.has(toDateStr(d))){ streak++; d.setDate(d.getDate()-1); }
    return streak;
  }

  /* ---------- View router ---------- */
  function renderView(){
    const c = document.getElementById('viewContainer');
    if(state.view==='tasks') c.innerHTML = tasksViewHtml();
    else if(state.view==='calendar') c.innerHTML = calendarViewHtml();
    else if(state.view==='pomodoro') c.innerHTML = pomodoroViewHtml();
    else if(state.view==='stats') c.innerHTML = statsViewHtml();
    if(state.view==='pomodoro') updateTimerDisplay();
  }

  function renderAll(){
    renderHeader();
    renderTabbar();
    renderView();
  }

  /* ---------- TASKS VIEW ---------- */
  function tasksViewHtml(){
    const chips = `<div class="chip-row">
      <button class="chip ${state.taskFilter==='all'?'active':''}" data-action="filter-cat" data-cat="all">Todas</button>
      ${state.categories.map(c=>`<button class="chip ${state.taskFilter===c.id?'active':''}" data-action="filter-cat" data-cat="${c.id}"><span class="dot" style="background:${c.color}"></span>${escapeHtml(c.name)}</button>`).join('')}
      <button class="chip" data-action="manage-categories">${ICONS.edit}</button>
    </div>`;

    let pool = state.tasks.filter(t=> state.taskFilter==='all' || t.categoryId===state.taskFilter);
    const t = todayStr();
    const overdue = pool.filter(x=>!x.done && x.due && x.due<t).sort((a,b)=>a.due.localeCompare(b.due));
    const today = pool.filter(x=>!x.done && x.due===t);
    const upcoming = pool.filter(x=>!x.done && x.due && x.due>t).sort((a,b)=>a.due.localeCompare(b.due));
    const noDate = pool.filter(x=>!x.done && !x.due);
    const done = pool.filter(x=>x.done).sort((a,b)=> (b.completedAt||0)-(a.completedAt||0));

    let html = chips;
    const groups = [
      ['Vencidas', overdue, true],
      ['Hoy', today, false],
      ['Próximas', upcoming, false],
      ['Sin fecha', noDate, false]
    ];
    let any=false;
    groups.forEach(([label, arr, overdueFlag])=>{
      if(arr.length===0) return;
      any=true;
      html += `<div class="section-label">${label} <span class="count">${arr.length}</span></div>`;
      html += arr.map(x=>taskRowHtml(x, overdueFlag)).join('');
    });
    if(!any && done.length===0){
      html += `<div class="empty-state">No hay tareas todavía.<br>Toca + para crear la primera.</div>`;
    }
    if(done.length>0){
      html += `<div class="collapsible-header ${state.collapsedDone?'':'open'}" data-action="toggle-done">
        <span class="section-label" style="margin:0;">Completadas <span class="count">${done.length}</span></span>
        ${ICONS.chevDown}
      </div>`;
      if(!state.collapsedDone){
        html += done.map(x=>taskRowHtml(x,false)).join('');
      }
    }
    return html;
  }

  function taskRowHtml(x, overdueFlag){
    const cat = catById(x.categoryId);
    let meta = `<span class="cat-dot" style="background:${cat.color}"></span>${escapeHtml(cat.name)}`;
    if(x.due) meta += ' · '+formatDueLabel(x.due, x.done);
    if(x.priority==='alta' && !x.done) meta += ' · Prioridad alta';
    return `<div class="task-row" style="border-left-color:${cat.color}">
      <button class="task-check ${x.done?'checked':''}" data-action="toggle-task" data-id="${x.id}">${x.done?ICONS.check:''}</button>
      <div class="task-info" data-action="edit-task" data-id="${x.id}">
        <div class="task-title ${x.done?'done':''}">${escapeHtml(x.title)}</div>
        <div class="task-meta ${overdueFlag?'overdue':''}">${meta}</div>
      </div>
      <button class="task-menu" data-action="edit-task" data-id="${x.id}">${ICONS.edit}</button>
    </div>`;
  }

  /* ---------- CALENDAR VIEW ---------- */
  function buildCalendarCells(year, month){
    const first = new Date(year, month, 1);
    const startOffset = (first.getDay()+6)%7;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const daysInPrev = new Date(year, month, 0).getDate();
    const cells = [];
    for(let i=startOffset-1;i>=0;i--) cells.push({day:daysInPrev-i, dateStr:toDateStr(new Date(year, month-1, daysInPrev-i)), current:false});
    for(let d=1; d<=daysInMonth; d++) cells.push({day:d, dateStr:toDateStr(new Date(year,month,d)), current:true});
    let next=1;
    while(cells.length % 7 !== 0){ cells.push({day:next, dateStr:toDateStr(new Date(year, month+1, next)), current:false}); next++; }
    return cells;
  }

  function calendarViewHtml(){
    const {year, month, selected} = state.cal;
    const cells = buildCalendarCells(year, month);
    const t = todayStr();
    let html = `<div class="cal-header">
      <button class="cal-nav-btn" data-action="cal-prev">${ICONS.chevL}</button>
      <div class="cal-title">${MONTHS[month]} ${year}</div>
      <button class="cal-nav-btn" data-action="cal-next">${ICONS.chevR}</button>
    </div>
    <div class="cal-weekdays">${WEEKDAYS.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">`;
    cells.forEach(cell=>{
      const dueHere = state.tasks.filter(x=>!x.done && x.due===cell.dateStr);
      const classes = ['cal-cell'];
      if(!cell.current) classes.push('dim');
      if(cell.dateStr===t) classes.push('today');
      if(cell.dateStr===selected) classes.push('selected');
      const dots = dueHere.slice(0,3).map(x=>`<span style="background:${cell.dateStr===selected?'#fff':catById(x.categoryId).color}"></span>`).join('');
      html += `<button class="${classes.join(' ')}" data-action="select-day" data-date="${cell.dateStr}">
        <span>${cell.day}</span>
        <span class="cal-dots">${dots}</span>
      </button>`;
    });
    html += `</div>`;

    const dayTasks = state.tasks.filter(x=>x.due===selected).sort((a,b)=>(a.done?1:0)-(b.done?1:0));
    const selD = parseDateStr(selected);
    html += `<div class="cal-day-list">
      <div class="section-label">${WEEKDAYS_LONG[selD.getDay()]}, ${selD.getDate()} de ${MONTHS[selD.getMonth()]} <span class="count">${dayTasks.length}</span></div>
      ${dayTasks.length ? dayTasks.map(x=>taskRowHtml(x, x.due<t && !x.done)).join('') : '<div class="empty-state">No hay tareas para este día.</div>'}
    </div>`;
    return html;
  }

  /* ---------- POMODORO VIEW ---------- */
  const CIRC = 2*Math.PI*90;
  function totalForMode(mode){
    if(mode==='focus') return state.settings.work*60;
    if(mode==='short') return state.settings.short*60;
    return state.settings.long*60;
  }
  function modeColor(mode){
    return mode==='focus' ? getComputedCssVar('--primary') : mode==='short' ? getComputedCssVar('--mint') : getComputedCssVar('--amber');
  }
  function getComputedCssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function modeLabel(mode){ return mode==='focus' ? 'Enfoque' : mode==='short' ? 'Descanso corto' : 'Descanso largo'; }

  function pomodoroViewHtml(){
    const pendingTasks = state.tasks.filter(x=>!x.done);
    const dotsCount = state.settings.longEvery;
    const filled = state.timer.sessionCount % dotsCount;
    return `
      <div class="pomo-mode" id="pomoModeLabel">${modeLabel(state.timer.mode)}</div>
      <div class="pomo-ring-wrap">
        <svg viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
          <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90" stroke-dasharray="${CIRC}" stroke-dashoffset="0"></circle>
        </svg>
        <div class="pomo-time" id="pomoTime">00:00</div>
      </div>
      <div class="pomo-session-dots" id="sessionDots">
        ${Array.from({length:dotsCount}).map((_,i)=>`<span class="${i<filled?'filled':''}"></span>`).join('')}
      </div>
      <div class="pomo-controls">
        <button class="pomo-btn-side" data-action="timer-reset">Reiniciar</button>
        <button class="pomo-btn-main" id="timerToggleBtn" data-action="timer-toggle">${state.timer.running?'Pausar':'Iniciar'}</button>
        <button class="pomo-btn-side" data-action="timer-skip">Saltar</button>
      </div>
      <div class="pomo-extra">
        <label class="field-label">Tarea en foco (opcional)</label>
        <select class="select-field" id="pomoTaskSelect" data-action="pomo-task-select">
          <option value="">Sin tarea asociada</option>
          ${pendingTasks.map(t=>`<option value="${t.id}" ${state.timer.taskId===t.id?'selected':''}>${escapeHtml(t.title)}</option>`).join('')}
        </select>
        <button class="link-btn" data-action="open-pomo-settings">Ajustar duración de sesiones</button>
      </div>`;
  }

  function updateTimerDisplay(){
    const el = document.getElementById('pomoTime');
    if(!el) return;
    const m = Math.floor(state.timer.remaining/60), s = state.timer.remaining%60;
    el.textContent = pad(m)+':'+pad(s);
    const ring = document.getElementById('ringProgress');
    const total = totalForMode(state.timer.mode);
    const progress = 1 - (state.timer.remaining/total);
    ring.style.strokeDashoffset = CIRC*(1-progress);
    ring.style.stroke = modeColor(state.timer.mode);
    const btn = document.getElementById('timerToggleBtn');
    if(btn) btn.textContent = state.timer.running ? 'Pausar' : 'Iniciar';
  }

  function timerToggle(){
    if(state.timer.running){ pauseTimer(); } else { startTimer(); }
  }
  function startTimer(){
    state.timer.running = true;
    state.timer.intervalId = setInterval(tick, 1000);
    updateTimerDisplay();
    const btn=document.getElementById('timerToggleBtn'); if(btn) btn.textContent='Pausar';
  }
  function pauseTimer(){
    state.timer.running = false;
    clearInterval(state.timer.intervalId);
    const btn=document.getElementById('timerToggleBtn'); if(btn) btn.textContent='Iniciar';
  }
  function tick(){
    state.timer.remaining--;
    if(state.timer.remaining<=0){ completeSegment(); } else { updateTimerDisplay(); }
  }
  function completeSegment(){
    clearInterval(state.timer.intervalId);
    state.timer.running=false;
    if(state.timer.mode==='focus'){
      state.sessions.push({id:uid(), date:todayStr(), minutes:state.settings.work, taskId:state.timer.taskId||null});
      state.timer.sessionCount++;
      scheduleSave();
      const isLong = state.timer.sessionCount % state.settings.longEvery === 0;
      state.timer.mode = isLong ? 'long' : 'short';
    } else {
      state.timer.mode = 'focus';
    }
    state.timer.remaining = totalForMode(state.timer.mode);
    renderHeader();
    renderView();
  }
  function resetTimer(){
    pauseTimer();
    state.timer.remaining = totalForMode(state.timer.mode);
    updateTimerDisplay();
  }
  function skipSegment(){
    pauseTimer();
    if(state.timer.mode==='focus'){
      state.timer.sessionCount++;
      const isLong = state.timer.sessionCount % state.settings.longEvery === 0;
      state.timer.mode = isLong ? 'long' : 'short';
    } else {
      state.timer.mode = 'focus';
    }
    state.timer.remaining = totalForMode(state.timer.mode);
    renderView();
  }

  /* ---------- STATS VIEW ---------- */
  function statsViewHtml(){
    const t = todayStr();
    const completedToday = state.tasks.filter(x=>x.done && x.completedAt && toDateStr(new Date(x.completedAt))===t).length;
    const minutesToday = state.sessions.filter(s=>s.date===t).reduce((a,s)=>a+s.minutes,0);
    const streak = computeStreak();

    const last7 = [];
    for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); last7.push(toDateStr(d)); }
    const completedByDay = last7.map(ds => state.tasks.filter(x=>x.done && x.completedAt && toDateStr(new Date(x.completedAt))===ds).length);
    const minutesByDay = last7.map(ds => state.sessions.filter(s=>s.date===ds).reduce((a,s)=>a+s.minutes,0));
    const maxCompleted = Math.max(1, ...completedByDay);
    const maxMinutes = Math.max(1, ...minutesByDay);

    const catStats = state.categories.map(c=>{
      const tasks = state.tasks.filter(x=>x.categoryId===c.id);
      const done = tasks.filter(x=>x.done).length;
      return {cat:c, total:tasks.length, done};
    }).filter(cs=>cs.total>0);

    return `
      <div class="stat-cards">
        <div class="stat-card"><div class="num">${completedToday}</div><div class="lbl">Completadas hoy</div></div>
        <div class="stat-card"><div class="num">${minutesToday}</div><div class="lbl">Minutos de enfoque hoy</div></div>
        <div class="stat-card"><div class="num">${streak}</div><div class="lbl">Días de racha</div></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Tareas completadas · últimos 7 días</div>
        <div class="bar-chart">
          ${last7.map((ds,i)=>{
            const d = parseDateStr(ds);
            const h = Math.max(4, (completedByDay[i]/maxCompleted)*80);
            return `<div class="bar-col"><div class="bar" style="height:${h}px; background:var(--mint);"></div><div class="bar-lbl">${WEEKDAYS[(d.getDay()+6)%7]}</div></div>`;
          }).join('')}
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Minutos de enfoque · últimos 7 días</div>
        <div class="bar-chart">
          ${last7.map((ds,i)=>{
            const d = parseDateStr(ds);
            const h = Math.max(4, (minutesByDay[i]/maxMinutes)*80);
            return `<div class="bar-col"><div class="bar" style="height:${h}px;"></div><div class="bar-lbl">${WEEKDAYS[(d.getDay()+6)%7]}</div></div>`;
          }).join('')}
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Progreso por categoría</div>
        ${catStats.length ? catStats.map(cs=>`
          <div class="cat-stat-row">
            <div class="cat-stat-top">
              <span class="name"><span class="dot" style="background:${cs.cat.color}"></span>${escapeHtml(cs.cat.name)}</span>
              <span class="frac">${cs.done}/${cs.total}</span>
            </div>
            <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(cs.done/cs.total)*100}%; background:${cs.cat.color};"></div></div>
          </div>`).join('') : '<div class="empty-state">Aún no hay tareas categorizadas.</div>'}
      </div>`;
  }

  /* ---------- SHEET (modal) ---------- */
  function openSheet(html){
    document.getElementById('sheet').innerHTML = `<div class="sheet-handle"></div>` + html;
    document.getElementById('sheetOverlay').classList.add('open');
  }
  function closeSheet(){
    document.getElementById('sheetOverlay').classList.remove('open');
  }

  function openTaskSheet(taskId){
    state.editingTaskId = taskId || null;
    const existing = taskId ? state.tasks.find(t=>t.id===taskId) : null;
    const title = existing ? existing.title : '';
    const catId = existing ? existing.categoryId : (state.categories[0] ? state.categories[0].id : '');
    const due = existing ? (existing.due||'') : (state.view==='calendar' ? state.cal.selected : '');
    const priority = existing ? existing.priority : 'media';

    openSheet(`
      <div class="sheet-title">${existing ? 'Editar tarea' : 'Nueva tarea'}</div>
      <input class="text-field" id="taskTitleInput" placeholder="¿Qué hay que hacer?" value="${escapeHtml(title)}" maxlength="120">
      <label class="field-label">Categoría</label>
      <div class="cat-pick-row" id="catPickRow">
        ${state.categories.map(c=>`<button class="cat-pick ${c.id===catId?'active':''}" style="--pcolor:${c.color}" data-cat="${c.id}"><span class="dot" style="background:${c.color}"></span>${escapeHtml(c.name)}</button>`).join('')}
      </div>
      <label class="field-label">Fecha límite (opcional)</label>
      <input class="text-field" id="taskDueInput" type="date" value="${due}">
      <label class="field-label">Prioridad</label>
      <div class="segmented" id="prioritySeg">
        <button class="seg-btn ${priority==='baja'?'active':''}" data-p="baja">Baja</button>
        <button class="seg-btn ${priority==='media'?'active':''}" data-p="media">Media</button>
        <button class="seg-btn ${priority==='alta'?'active':''}" data-p="alta">Alta</button>
      </div>
      <div class="sheet-actions">
        ${existing ? `<button class="btn-ghost" id="deleteTaskBtn">${ICONS.trash}</button>` : ''}
        <button class="btn-primary" id="saveTaskBtn">${existing?'Guardar cambios':'Crear tarea'}</button>
      </div>
    `);

    let selectedCat = catId, selectedPriority = priority;
    document.getElementById('catPickRow').addEventListener('click', e=>{
      const btn = e.target.closest('.cat-pick'); if(!btn) return;
      selectedCat = btn.dataset.cat;
      document.querySelectorAll('#catPickRow .cat-pick').forEach(b=>b.classList.toggle('active', b===btn));
    });
    document.getElementById('prioritySeg').addEventListener('click', e=>{
      const btn = e.target.closest('.seg-btn'); if(!btn) return;
      selectedPriority = btn.dataset.p;
      document.querySelectorAll('#prioritySeg .seg-btn').forEach(b=>b.classList.toggle('active', b===btn));
    });
    document.getElementById('saveTaskBtn').addEventListener('click', ()=>{
      const titleVal = document.getElementById('taskTitleInput').value.trim();
      if(!titleVal) return;
      const dueVal = document.getElementById('taskDueInput').value || '';
      if(existing){
        Object.assign(existing, {title:titleVal, categoryId:selectedCat, due:dueVal, priority:selectedPriority});
      } else {
        state.tasks.push({id:uid(), title:titleVal, categoryId:selectedCat, due:dueVal, priority:selectedPriority, done:false, createdAt:Date.now(), completedAt:null});
      }
      scheduleSave();
      closeSheet();
      renderHeader(); renderView();
    });
    if(existing){
      document.getElementById('deleteTaskBtn').addEventListener('click', ()=>{
        state.tasks = state.tasks.filter(t=>t.id!==existing.id);
        scheduleSave();
        closeSheet();
        renderHeader(); renderView();
      });
    }
  }

  function openCategoriesSheet(){
    openSheet(`
      <div class="sheet-title">Categorías</div>
      <div id="catList">
        ${state.categories.map(c=>`
          <div class="cat-manage-row">
            <span class="dot" style="background:${c.color}"></span>
            <span class="name">${escapeHtml(c.name)}</span>
            <button data-del="${c.id}">${ICONS.trash}</button>
          </div>`).join('')}
      </div>
      <label class="field-label" style="margin-top:18px;">Nueva categoría</label>
      <input class="text-field" id="newCatName" placeholder="Nombre de la categoría" maxlength="24">
      <label class="field-label">Color</label>
      <div class="color-swatches" id="colorSwatches">
        ${CAT_PALETTE.map((c,i)=>`<button class="swatch ${i===0?'active':''}" style="background:${c}" data-color="${c}"></button>`).join('')}
      </div>
      <div class="sheet-actions">
        <button class="btn-primary" id="addCatBtn">Añadir categoría</button>
      </div>
    `);
    let chosenColor = CAT_PALETTE[0];
    document.getElementById('colorSwatches').addEventListener('click', e=>{
      const s = e.target.closest('.swatch'); if(!s) return;
      chosenColor = s.dataset.color;
      document.querySelectorAll('#colorSwatches .swatch').forEach(el=>el.classList.toggle('active', el===s));
    });
    document.getElementById('catList').addEventListener('click', e=>{
      const btn = e.target.closest('[data-del]'); if(!btn) return;
      const id = btn.dataset.del;
      if(state.categories.length<=1) return;
      state.categories = state.categories.filter(c=>c.id!==id);
      const fallback = state.categories[0].id;
      state.tasks.forEach(t=>{ if(t.categoryId===id) t.categoryId = fallback; });
      scheduleSave();
      openCategoriesSheet();
      renderView();
    });
    document.getElementById('addCatBtn').addEventListener('click', ()=>{
      const name = document.getElementById('newCatName').value.trim();
      if(!name) return;
      state.categories.push({id:uid(), name, color:chosenColor});
      scheduleSave();
      openCategoriesSheet();
      renderView();
    });
  }

  function openPomoSettingsSheet(){
    const s = state.settings;
    openSheet(`
      <div class="sheet-title">Ajustes de Pomodoro</div>
      <label class="field-label">Minutos de enfoque</label>
      <input class="text-field" id="setWork" type="number" min="1" max="120" value="${s.work}">
      <label class="field-label">Descanso corto (minutos)</label>
      <input class="text-field" id="setShort" type="number" min="1" max="60" value="${s.short}">
      <label class="field-label">Descanso largo (minutos)</label>
      <input class="text-field" id="setLong" type="number" min="1" max="60" value="${s.long}">
      <label class="field-label">Sesiones antes del descanso largo</label>
      <input class="text-field" id="setEvery" type="number" min="1" max="10" value="${s.longEvery}">
      <div class="sheet-actions">
        <button class="btn-primary" id="saveSettingsBtn">Guardar</button>
      </div>
    `);
    document.getElementById('saveSettingsBtn').addEventListener('click', ()=>{
      state.settings.work = Math.max(1, parseInt(document.getElementById('setWork').value)||25);
      state.settings.short = Math.max(1, parseInt(document.getElementById('setShort').value)||5);
      state.settings.long = Math.max(1, parseInt(document.getElementById('setLong').value)||15);
      state.settings.longEvery = Math.max(1, parseInt(document.getElementById('setEvery').value)||4);
      pauseTimer();
      state.timer.remaining = totalForMode(state.timer.mode);
      scheduleSave();
      closeSheet();
      renderView();
    });
  }

  /* ---------- Event delegation ---------- */
  document.getElementById('viewContainer').addEventListener('click', handleAction);
  document.getElementById('tabbar').addEventListener('click', handleAction);
  document.getElementById('fab').addEventListener('click', ()=> openTaskSheet(null));
  document.getElementById('sheetOverlay').addEventListener('click', e=>{
    if(e.target.id==='sheetOverlay') closeSheet();
  });

  function handleAction(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    if(action==='go-view'){
      state.view = el.dataset.view;
      renderTabbar(); renderView();
    } else if(action==='filter-cat'){
      state.taskFilter = el.dataset.cat;
      renderView();
    } else if(action==='manage-categories'){
      openCategoriesSheet();
    } else if(action==='toggle-task'){
      const t = state.tasks.find(x=>x.id===el.dataset.id);
      if(t){ t.done = !t.done; t.completedAt = t.done ? Date.now() : null; scheduleSave(); renderHeader(); renderView(); }
    } else if(action==='edit-task'){
      openTaskSheet(el.dataset.id);
    } else if(action==='toggle-done'){
      state.collapsedDone = !state.collapsedDone;
      renderView();
    } else if(action==='cal-prev'){
      let {year,month} = state.cal; month--; if(month<0){month=11;year--;}
      state.cal.year=year; state.cal.month=month; renderView();
    } else if(action==='cal-next'){
      let {year,month} = state.cal; month++; if(month>11){month=0;year++;}
      state.cal.year=year; state.cal.month=month; renderView();
    } else if(action==='select-day'){
      state.cal.selected = el.dataset.date;
      renderView();
    } else if(action==='timer-toggle'){
      timerToggle();
    } else if(action==='timer-reset'){
      resetTimer();
    } else if(action==='timer-skip'){
      skipSegment();
    } else if(action==='open-pomo-settings'){
      openPomoSettingsSheet();
    }
  }
  document.addEventListener('change', e=>{
    if(e.target.id==='pomoTaskSelect'){ state.timer.taskId = e.target.value; }
  });

  /* ---------- Init ---------- */
  async function init(){
    await loadData();
    renderAll();
  }
  init();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
